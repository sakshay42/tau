[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tau"
version = "0.1.0"
description = "Ingestion and retrieval pipeline for tau"
requires-python = ">=3.10"
dependencies = [
    "feedparser",
    "requests",
    "beautifulsoup4",
    "pydantic",
    "pandas",
    "websockets",
    "python-dotenv",
    "psycopg[binary]",
    "pgvector",
    "langgraph",
    "mcp",
]

[project.optional-dependencies]
dev = [
    "ipykernel",
    "nbclient",
    "nbformat",
]

[tool.setuptools.packages.find]
where = ["src"]
